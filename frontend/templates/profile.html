{% extends "base.html" %}
{% block title %}个人资料 · {{ app_name }}{% endblock %}

{% block content %}
<article style="max-width: 640px; margin: 2rem auto;">
  <h2>个人资料</h2>
  <div x-data="prof()" x-init="load()">
    <table>
      <tbody>
        <tr><td><strong>邮箱</strong></td><td x-text="user.email || '…'"></td></tr>
        <tr><td><strong>姓名</strong></td><td x-text="user.first_name + user.last_name"></td></tr>
        <tr><td><strong>角色</strong></td><td x-text="roleNames[user.role] || user.role"></td></tr>
        <tr><td><strong>租户</strong></td><td x-text="user.tenant_name || '—(超级管理员)—'"></td></tr>
        <template x-if="user.nurse_id">
          <tr><td><strong>关联护士</strong></td><td x-text="user.nurse_name || '—'"></td></tr>
        </template>
        <template x-if="user.role === 'nurse'">
          <tr>
            <td><strong>业务角色</strong></td>
            <td>
              <template x-for="rn in user.nurse_role_names" :key="rn">
                <span class="tag" style="margin-right:0.35rem;" x-text="rn"></span>
              </template>
              <span x-show="!user.nurse_role_names?.length">—</span>
            </td>
          </tr>
        </template>
        <template x-if="user.role === 'nurse'">
          <tr>
            <td><strong>技能</strong></td>
            <td>
              <template x-for="skill in user.nurse_skill_names" :key="skill">
                <span class="tag" style="margin-right:0.35rem;" x-text="skill"></span>
              </template>
              <span x-show="!user.nurse_skill_names?.length">—</span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>

    <h3>修改姓名</h3>
    <form @submit.prevent="saveName()">
      <div class="grid">
        <label>名 <input type="text" x-model="nameForm.first_name" required maxlength="100"></label>
        <label>姓 <input type="text" x-model="nameForm.last_name" required maxlength="100"></label>
      </div>
      <button type="submit">保存</button>
      <span x-show="nameMsg" x-text="nameMsg" style="margin-left:0.5rem;"></span>
    </form>

    <h3>修改密码</h3>
    <form @submit.prevent="savePassword()">
      <label>旧密码 <input type="password" x-model="pwForm.old_password" required></label>
      <label>新密码(至少8位) <input type="password" x-model="pwForm.new_password" required minlength="8"></label>
      <button type="submit">修改密码</button>
      <span x-show="pwMsg" x-text="pwMsg" style="margin-left:0.5rem;" :style="pwOk ? '' : 'color:crimson'"></span>
    </form>

    <h3>双因素认证 (MFA)</h3>
    <div>
      <p x-show="mfaStatusMsg" x-text="mfaStatusMsg" style="margin:0 0 0.5rem;"></p>
      <template x-if="!user.mfa_enabled && user.role === 'tenant_admin'">
        <p style="font-size:0.85rem;">建议开启两步验证，保护管理员账号。</p>
      </template>
      <template x-if="!user.mfa_enabled && user.role === 'super_admin'">
        <p style="color:crimson; font-weight:600;">超级管理员必须开启两步验证后才能继续使用管理功能。</p>
      </template>

      <template x-if="!user.mfa_enabled && !mfaSetupUri">
        <div>
          <button type="button" class="secondary" @click="startMfa()">开始设置 MFA</button>
        </div>
      </template>

      <template x-if="!user.mfa_enabled && mfaSetupUri">
        <div>
          <p style="font-size:0.85rem;">请用 Authenticator 扫描二维码或手动输入密钥，然后输入 6 位验证码确认。</p>
          <div style="text-align:center; margin:0.75rem 0;" x-html="mfaQrSvg"></div>
          <details style="margin-bottom:0.5rem;">
            <summary style="font-size:0.85rem; cursor:pointer;">无法扫码？手动输入密钥</summary>
            <code style="word-break:break-all; font-size:0.8rem;" x-text="mfaSetupUri"></code>
          </details>
          <form @submit.prevent="confirmMfa()">
            <label>验证码
              <input type="text" x-model="mfaConfirmForm.code" required
                     pattern="[0-9]{6}" maxlength="6" inputmode="numeric"
                     placeholder="123456">
            </label>
            <button type="submit">确认启用</button>
          </form>
        </div>
      </template>

      <template x-if="mfaRecoveryCodes.length">
        <div style="background:#fff8e1; padding:0.75rem; margin-top:0.5rem; border-radius:4px;">
          <p style="font-weight:600; margin:0 0 0.35rem;">请保存以下恢复码（仅显示一次）：</p>
          <template x-for="code in mfaRecoveryCodes" :key="code">
            <code x-text="code" style="display:inline-block; margin-right:0.5rem;"></code>
          </template>
        </div>
      </template>

      <template x-if="user.mfa_enabled">
        <div>
          <p style="color:green;">✅ MFA 已启用</p>
        </div>
      </template>
    </div>

    <template x-if="user.role === 'super_admin'">
      <div>
        <h3>关于页面内容</h3>
        <p style="font-size:0.85rem; opacity:0.7;">以下内容显示在"关于"页面，留空则使用默认介绍。</p>
        <form @submit.prevent="saveSiteInfo()">
          <label>联系邮箱 <input type="email" x-model="siteInfoForm.contact_email" placeholder="support@example.com"></label>
          <label>项目介绍
            <textarea x-model="siteInfoForm.about_text" rows="8" placeholder="项目介绍内容…支持纯文本"></textarea>
          </label>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <button type="submit">保存</button>
            <span x-show="siteInfoMsg" x-text="siteInfoMsg" :style="siteInfoOk ? '' : 'color:crimson'"></span>
          </div>
        </form>
      </div>
    </template>
  </div>
</article>

<script src="/static/js/profile.js"></script>
{% endblock %}
