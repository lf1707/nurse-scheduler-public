  [project]
  name = "nurse-scheduler"
  version = "0.1.0"
  description = "Multi-tenant nurse scheduling SaaS with OR-Tools CP-SAT"
  requires-python = ">=3.11"
  dependencies = [
      # Web framework
      "fastapi>=0.115.0",
      "uvicorn[standard]>=0.30.0",
      "python-multipart>=0.0.9",
      "websockets>=12.0",
      # Database
      "sqlalchemy[asyncio]>=2.0.30",
      "asyncpg>=0.29.0",
      "alembic>=1.13.0",
      "psycopg2-binary>=2.9.9",  # for alembic sync operations
      # Redis + Celery
      "redis>=5.0.0",
      "celery>=5.4.0",
      "flower>=2.0.0",  # celery monitor
      # Auth
      "fastapi-users[sqlalchemy]>=14.0.0",
      "pyjwt>=2.8.0",
      "passlib>=1.7.4",
      "argon2-cffi>=23.1.0",  # 替代 bcrypt
      "pyotp>=2.10.0",
      # Config & validation
      "pydantic>=2.7.0",
      "pydantic-settings>=2.2.0",
      "email-validator>=2.1.0",
      # Frontend (HTMX/Alpine server-rendered, no Node build chain)
      "jinja2>=3.1.0",
      # Scheduling engine
      "ortools>=9.11.0",
      # Utils
      "python-dateutil>=2.9.0",
      "structlog>=24.1.0",
      "httpx>=0.27.0",
      "ics>=0.7.2",  # iCalendar export
      "reportlab>=4.0.0",
      "qrcode[pil]>=8.2",
]

[tool.uv]
index-url = "https://pypi.org/simple"

  [project.optional-dependencies]
  dev = [
      "pytest>=8.0.0",
      "pytest-asyncio>=0.23.0",
      "pytest-cov>=5.0.0",
      "httpx>=0.27.0",
      "ruff>=0.4.0",
      "mypy>=1.10.0",
      "ipython>=8.20.0",
      "aiosqlite>=0.20.0",  # for async test DB (sqlite fallback)
  ]

  [tool.pytest.ini_options]
  asyncio_mode = "auto"
  testpaths = ["app/tests"]
  python_files = "test_*.py"
  python_classes = "Test*"
  python_functions = "test_*"
  addopts = "-v --tb=short"

  [tool.ruff]
  line-length = 100
  target-version = "py311"

  [tool.setuptools.packages.find]
  include = ["app*"]

  [tool.ruff.lint]
  select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
  ignore = [
    "E501",  # line-too-long: repo style runs ~110 chars; not enforced historically
    "B008",  # function-call-in-default-argument: false positive for FastAPI Depends()/Query()
  ]

  [tool.mypy]
  python_version = "3.11"
  strict = true
  warn_return_any = true
  warn_unused_configs = true
  ignore_missing_imports = true
